services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-belocar}
      MYSQL_USER: ${DB_USER:-belocar}
      MYSQL_PASSWORD: ${DB_PASSWORD:-belocar}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-belocar_root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - belocar_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-belocar_root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-belocar}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&useUnicode=true&characterEncoding=UTF-8
      DB_USER: ${DB_USER:-belocar}
      DB_PASSWORD: ${DB_PASSWORD:-belocar}
      JWT_SECRET: ${JWT_SECRET:?Debes definir JWT_SECRET en tu archivo .env}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-480}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      WHATSAPP_DEFAULT_NUMBER: ${WHATSAPP_DEFAULT_NUMBER:-56900000000}
      ADMIN_DEFAULT_USERNAME: ${ADMIN_DEFAULT_USERNAME:-admin}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-changeme123}
      FILE_STORAGE_LOCAL_DIR: /app/uploads
      FILE_STORAGE_PUBLIC_BASE_URL: /uploads
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - belocar_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  belocar_mysql_data:
  belocar_uploads:
