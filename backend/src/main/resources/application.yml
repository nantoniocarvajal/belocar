server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: belocar-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/belocar?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&useUnicode=true&characterEncoding=UTF-8}
    username: ${DB_USER:belocar}
    password: ${DB_PASSWORD:belocar}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

belocar:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-this-is-not-for-production-use-only-local}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    local-dir: ${FILE_STORAGE_LOCAL_DIR:uploads}
    public-base-url: ${FILE_STORAGE_PUBLIC_BASE_URL:/uploads}
  whatsapp:
    default-number: ${WHATSAPP_DEFAULT_NUMBER:56900000000}
  admin:
    default-username: ${ADMIN_DEFAULT_USERNAME:admin}
    default-password: ${ADMIN_DEFAULT_PASSWORD:changeme123}

logging:
  level:
    cl.belocar.backend: ${LOG_LEVEL:INFO}
