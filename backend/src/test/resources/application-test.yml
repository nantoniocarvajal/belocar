spring:
  datasource:
    url: jdbc:h2:mem:belocar_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

belocar:
  jwt:
    secret: test-secret-not-for-production-use-only-in-automated-tests
    expiration-minutes: 60
  cors:
    allowed-origins: http://localhost:5173
  storage:
    local-dir: build/test-uploads
    public-base-url: /uploads
  whatsapp:
    default-number: 56900000000
  admin:
    default-username: admin
    default-password: test-password-123
